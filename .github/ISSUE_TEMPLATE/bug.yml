name: Signaler un bug
description: Un comportement inattendu, avec une reproduction minimale.
title: '[Bug] '
body:
  - type: markdown
    attributes:
      value: Ne joins jamais de sauvegarde personnelle. Pour une vulnérabilité, lis SECURITY.md.
  - type: textarea
    id: steps
    attributes:
      label: Étapes et résultat
      description: Que fais-tu, que vois-tu et qu'attendais-tu ?
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Version, navigateur et appareil
      placeholder: V1.0.0, Firefox, Linux ; site public ou Docker
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Capture ou informations supplémentaires
      description: Uniquement des données fictives ; précise si les données locales sont touchées.
